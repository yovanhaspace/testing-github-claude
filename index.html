<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elephants in the Rain</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
const NUM_ELEPHANTS = 3;
const NUM_RAINDROPS = 300;

let elephants = [];
let raindrops = [];
let puddles = [];
let lightning = { active: false, timer: 0, nextStrike: 200 };
let t = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  for (let i = 0; i < NUM_ELEPHANTS; i++) {
    elephants.push(new Elephant(
      (i + 1) * width / (NUM_ELEPHANTS + 1),
      height - 120 + random(-20, 20),
      random(0.8, 1.2)
    ));
  }
  for (let i = 0; i < NUM_RAINDROPS; i++) {
    raindrops.push(new Raindrop());
  }
  for (let i = 0; i < 8; i++) {
    puddles.push({ x: random(width), y: height - 10, r: random(20, 60), ripples: [] });
  }
}

function draw() {
  t++;

  // Sky gradient
  let skyColor = lightning.active ? color(200, 200, 255) : color(10, 10, 40);
  background(skyColor);

  drawClouds();
  drawPuddles();

  // Rain
  for (let r of raindrops) {
    r.update();
    r.show();
  }

  // Elephants
  for (let e of elephants) {
    e.update();
    e.show();
  }

  drawGround();
  handleLightning();
}

function drawClouds() {
  noStroke();
  fill(40, 40, 65, 200);
  for (let i = 0; i < 5; i++) {
    let cx = ((i * 230 + t * 0.15) % (width + 200)) - 100;
    let cy = 60 + sin(i * 1.3) * 30;
    ellipse(cx, cy, 200, 70);
    ellipse(cx - 60, cy + 20, 140, 60);
    ellipse(cx + 60, cy + 15, 160, 55);
  }
}

function drawGround() {
  // Wet ground
  noStroke();
  fill(20, 30, 20);
  rect(0, height - 30, width, 30);
  // Wet sheen
  fill(30, 60, 80, 80);
  rect(0, height - 28, width, 10);
}

function drawPuddles() {
  for (let p of puddles) {
    noStroke();
    fill(30, 60, 100, 120);
    ellipse(p.x, p.y, p.r * 2, p.r * 0.5);
    // Ripples
    if (frameCount % 20 === 0) p.ripples.push({ r: 2, a: 180 });
    for (let i = p.ripples.length - 1; i >= 0; i--) {
      let rip = p.ripples[i];
      noFill();
      stroke(80, 140, 200, rip.a);
      strokeWeight(1);
      ellipse(p.x, p.y, rip.r * 2, rip.r * 0.5);
      rip.r += 0.5;
      rip.a -= 4;
      if (rip.a <= 0) p.ripples.splice(i, 1);
    }
  }
}

function handleLightning() {
  lightning.nextStrike--;
  if (lightning.nextStrike <= 0) {
    lightning.active = true;
    lightning.timer = 5;
    lightning.nextStrike = int(random(200, 600));
    drawLightningBolt(random(width * 0.2, width * 0.8), 0, random(width * 0.1, width * 0.9), height * 0.5);
  }
  if (lightning.active) {
    lightning.timer--;
    if (lightning.timer <= 0) lightning.active = false;
  }
}

function drawLightningBolt(x1, y1, x2, y2) {
  stroke(220, 220, 255, 200);
  strokeWeight(2);
  let segments = 8;
  let pts = [{ x: x1, y: y1 }];
  for (let i = 1; i < segments; i++) {
    let frac = i / segments;
    pts.push({
      x: lerp(x1, x2, frac) + random(-40, 40),
      y: lerp(y1, y2, frac)
    });
  }
  pts.push({ x: x2, y: y2 });
  for (let i = 0; i < pts.length - 1; i++) {
    line(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
  }
}

// ---- Raindrop ----
class Raindrop {
  constructor() { this.reset(true); }
  reset(init = false) {
    this.x = random(width);
    this.y = init ? random(-height, 0) : random(-50, -5);
    this.len = random(10, 25);
    this.speed = random(8, 16);
    this.alpha = random(100, 200);
  }
  update() {
    this.y += this.speed;
    this.x += 1.5; // slight wind
    if (this.y > height) this.reset();
  }
  show() {
    stroke(150, 200, 255, this.alpha);
    strokeWeight(1);
    line(this.x, this.y, this.x + 2, this.y + this.len);
  }
}

// ---- Elephant ----
class Elephant {
  constructor(x, y, scale) {
    this.x = x;
    this.y = y;
    this.scale = scale;
    this.bobOffset = random(TWO_PI);
    this.legPhase = random(TWO_PI);
    this.trunkWave = random(TWO_PI);
    this.earFlap = random(TWO_PI);
    this.color = color(random(100, 140), random(100, 130), random(110, 150));
    this.hatColor = color(random(20, 60), random(20, 60), random(20, 60));
    this.hatBandColor = color(random(150, 255), random(50, 150), random(50, 100));
    this.eyeX = 0;
    this.eyeY = 0;
    this.umbrellaAngle = sin(this.bobOffset) * 0.05;
  }

  update() {
    this.bobOffset += 0.04;
    this.legPhase += 0.06;
    this.trunkWave += 0.03;
    this.earFlap += 0.05;
    this.umbrellaAngle = sin(this.bobOffset * 0.7) * 0.08;
  }

  show() {
    push();
    translate(this.x, this.y + sin(this.bobOffset) * 4);
    scale(this.scale);

    let c = this.color;
    let dark = color(red(c) - 30, green(c) - 30, blue(c) - 30);

    // Shadow
    noStroke();
    fill(0, 0, 0, 40);
    ellipse(0, 85, 120, 20);

    // Legs
    this.drawLegs(dark);

    // Body
    noStroke();
    fill(c);
    ellipse(0, 30, 110, 80);

    // Ear
    fill(dark);
    push();
    translate(-50, 10);
    rotate(sin(this.earFlap) * 0.1 - 0.1);
    ellipse(-10, 0, 50, 60);
    pop();

    // Head
    fill(c);
    ellipse(45, -10, 70, 65);

    // Trunk
    this.drawTrunk(dark);

    // Eye
    fill(255);
    ellipse(62, -18, 14, 14);
    fill(20);
    ellipse(64, -17, 7, 7);
    fill(255);
    ellipse(66, -19, 3, 3);

    // Top hat
    this.drawTopHat();

    // Umbrella
    this.drawUmbrella();

    pop();
  }

  drawLegs(dark) {
    noStroke();
    fill(dark);
    let offsets = [-35, -12, 12, 35];
    for (let i = 0; i < 4; i++) {
      let swing = (i % 2 === 0 ? 1 : -1) * sin(this.legPhase) * 6;
      let lx = offsets[i];
      rect(lx - 12, 55 + swing, 24, 40, 8);
      // Foot
      fill(color(red(dark) - 10, green(dark) - 10, blue(dark) - 10));
      ellipse(lx, 96 + swing, 26, 14);
      fill(dark);
    }
  }

  drawTrunk(dark) {
    noStroke();
    fill(dark);
    let wave = sin(this.trunkWave);
    beginShape();
    vertex(72, 5);
    bezierVertex(
      95 + wave * 15, 20,
      100 + wave * 20, 50,
      85 + wave * 25, 70
    );
    bezierVertex(
      80 + wave * 25, 75,
      70 + wave * 22, 72,
      68 + wave * 20, 65
    );
    bezierVertex(
      80 + wave * 15, 45,
      82 + wave * 10, 20,
      62, 10
    );
    endShape(CLOSE);
    // Trunk tip
    fill(color(red(dark) - 15, green(dark) - 15, blue(dark) - 15));
    ellipse(80 + wave * 25, 70, 18, 12);
  }

  drawTopHat() {
    let hc = this.hatColor;
    let band = this.hatBandColor;
    // Hat brim
    noStroke();
    fill(hc);
    ellipse(38, -40, 75, 15);
    // Hat body
    fill(hc);
    rect(10, -85, 56, 46, 3);
    // Hat band
    fill(band);
    rect(10, -52, 56, 10);
    // Hat top highlight
    fill(red(hc) + 20, green(hc) + 20, blue(hc) + 20, 80);
    rect(12, -83, 52, 8, 2);
    // Rain drops on hat
    fill(150, 200, 255, 120);
    for (let i = 0; i < 4; i++) {
      ellipse(15 + i * 14, -44, 3, 5);
    }
  }

  drawUmbrella() {
    push();
    translate(10, -90);
    rotate(this.umbrellaAngle - 0.2);

    // Handle
    stroke(80, 50, 30);
    strokeWeight(3);
    noFill();
    beginShape();
    vertex(0, 0);
    vertex(0, 60);
    bezierVertex(0, 70, -10, 75, -10, 80);
    endShape();

    // Canopy
    noStroke();
    // Panels alternating colors
    let panelColors = [
      color(200, 50, 50),
      color(255, 255, 255),
      color(200, 50, 50),
      color(255, 255, 255),
      color(200, 50, 50),
      color(255, 255, 255),
      color(200, 50, 50),
      color(255, 255, 255),
    ];
    let r = 55;
    let panels = panelColors.length;
    for (let i = 0; i < panels; i++) {
      fill(panelColors[i]);
      let a1 = map(i, 0, panels, PI, TWO_PI);
      let a2 = map(i + 1, 0, panels, PI, TWO_PI);
      beginShape();
      vertex(0, 0);
      for (let a = a1; a <= a2; a += 0.05) {
        let ex = cos(a) * r;
        let ey = sin(a) * r * 0.4;
        vertex(ex, ey);
      }
      endShape(CLOSE);
    }
    // Canopy edge scallops
    stroke(150, 150, 150, 180);
    strokeWeight(1.5);
    noFill();
    for (let i = 0; i < panels; i++) {
      let a = map(i + 0.5, 0, panels, PI, TWO_PI);
      let ex = cos(a) * r;
      let ey = sin(a) * r * 0.4;
      ellipse(ex, ey, 10, 6);
    }
    // Tip
    noStroke();
    fill(80, 50, 30);
    ellipse(0, -3, 8, 8);

    pop();
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
